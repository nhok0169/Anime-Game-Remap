name: Integration Tests

on:
  workflow_call:
    inputs:
      artifact:
        description: >
          The built API package to restore before testing. The testers import FixRaidenBoss2, whose
          __init__ pulls in the compiled core, and nothing compiled is tracked -- so without this the
          run fails at import.
        type: string
        default: ""
      python-version:
        description: >
          MUST be the python the artifact was built for. A compiled extension is built for one
          python, so a mismatch here fails at import and looks like a broken build.
        type: string
        default: "3.12"

jobs:
  integration-tests:
    name: Run Integration Tester
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # restored on top of the checkout, so the compiled modules land beside the tracked .py files
    #   exactly where a local build puts them
    - name: Restore the built API
      if: inputs.artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: Anime Game Remap (for all users)/api/src/py/FixRaidenBoss2

    # The tester imports the API straight from the source tree rather than pip installing it, so the
    #   API's OWN runtime dependencies are never installed by anything else -- and a compiled module
    #   needs them to import at all: without numpy, CyDictTools dies in its auto-generated
    #   import_array(), whose message ('numpy.core.multiarray failed to import') does not say numpy is
    #   missing. They are read out of api/pyproject.toml so this cannot drift from what the package
    #   declares. tomllib is 3.11+, which the pinned python-version input satisfies.
    - name: Install the API's runtime dependencies
      shell: bash
      run: |
        python -c "import tomllib; print(chr(10).join(tomllib.load(open('Anime Game Remap (for all users)/api/pyproject.toml', 'rb'))['project']['dependencies']))" > api-requirements.txt
        cat api-requirements.txt
        python -m pip install -r api-requirements.txt

    - name: Install Tester Dependencies
      run: python3 -m pip install -r requirements.txt
      working-directory: './Testing/Integration Tester'

    # after every install, so a failure here is the build's and not a missing dependency
    - name: Prove the API imports before testing anything
      if: inputs.artifact != ''
      shell: bash
      run: |
        cd "Anime Game Remap (for all users)/api/src/py"
        python -c "import FixRaidenBoss2 as F; print('IMPORT OK,', len(F.__all__), 'names')"

    - name: Run Integration Tests
      run: python3 main.py runSuite
      working-directory: './Testing/Integration Tester'
    
