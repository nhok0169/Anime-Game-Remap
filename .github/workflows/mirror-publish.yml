# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload AG Remap Mirror Package

# Publishing the mirror on its own, which does the same build-and-test first that a release does:
#
#   1. build the API
#   2. run both testers against that build, at the same time
#   3. once both pass, build the mirror's distribution and publish AnimeGameRemap
#
# note: a RELEASE does not come through here. It runs python-publish.yml, which publishes
#   FixRaidenBoss2 first and only then calls the same reusable mirror publish -- because the mirror
#   pins 'FixRaidenBoss2==<version>' and would otherwise ship ahead of its own dependency. Use this
#   workflow when the API at that pinned version is already on PyPI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
# -------------------------------------------------
# 1 + 2. Build once, then both testers in parallel
# -------------------------------------------------
  build-and-test:
    name: Build and Test
    uses: './.github/workflows/test-workflow.yml'


# -------------------------------------------------
# 3. Build the mirror's distribution and publish it
#
# note: the permissions are declared HERE rather than only inside the called workflow. A called
#   workflow cannot hold more than its caller grants, and this file's workflow-level permissions are
#   'contents: read' -- so without this the mirror's trusted publishing would be denied its token.
# -------------------------------------------------
  publish-mirror:
    name: Publish AnimeGameRemap Package to PyPI
    needs: build-and-test

    permissions:
      contents: read
      id-token: write

    uses: './.github/workflows/mirror-publish-workflow.yml'
