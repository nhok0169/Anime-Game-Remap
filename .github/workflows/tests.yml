name: Testers

# A pull request, the nightly schedule, or a manual run: build once, then run both testers against
# that build at the same time.
#
# note: a push does not run this. Both testers have grown expensive enough that running them on every
#   commit of every branch is not worth it -- a pull request still runs them before anything merges,
#   the schedule still catches a slow regression overnight, every publish workflow runs them before
#   it ships anything, and workflow_dispatch is here to run them on demand.
#
# note: this replaces the separate unit-tests.yml and integration-tests.yml. Those each built the API
#   for themselves, so a pull request paid for TWO builds of the same commit.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build-and-test:
    name: 'Build and Test'
    uses: './.github/workflows/test-workflow.yml'
