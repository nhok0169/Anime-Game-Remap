<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" role="img" aria-label="Seal and banner of The Council of CLAUDE agents">
  <defs>
    <!-- Aged leather / wine-dark backdrop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f14"/>
      <stop offset="50%" stop-color="#2b1220"/>
      <stop offset="100%" stop-color="#1a0f14"/>
    </linearGradient>

    <!-- Hammered bronze-and-gold banding -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6b4423"/>
      <stop offset="35%"  stop-color="#d4af37"/>
      <stop offset="65%"  stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6b4423"/>
    </linearGradient>

    <!-- One colour per Council member, kept as the inner inlay / halo -->
    <linearGradient id="councilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"    stop-color="#eab308"/>
      <stop offset="12.5%" stop-color="#db2777"/>
      <stop offset="25%"   stop-color="#0d9488"/>
      <stop offset="37.5%" stop-color="#3776ab"/>
      <stop offset="50%"   stop-color="#4f46e5"/>
      <stop offset="62.5%" stop-color="#f59e0b"/>
      <stop offset="75%"   stop-color="#c2410c"/>
      <stop offset="87.5%" stop-color="#dc2626"/>
      <stop offset="100%"  stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#5b1a63"/>
      <stop offset="55%"  stop-color="#4a154b"/>
      <stop offset="100%" stop-color="#2e0c30"/>
    </linearGradient>

    <!-- Cloth shading for the hanging flags -->
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#63204f"/>
      <stop offset="45%"  stop-color="#4a154b"/>
      <stop offset="100%" stop-color="#280a2c"/>
    </linearGradient>
    <linearGradient id="leftFlagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0b429"/>
      <stop offset="50%"  stop-color="#b45309"/>
      <stop offset="100%" stop-color="#6b3d0f"/>
    </linearGradient>
    <linearGradient id="rightFlagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <radialGradient id="gemGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="55%"  stop-color="#eab308"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>

    <!-- Bright polished gold, matched to the orb finials' palette -->
    <linearGradient id="sceptreGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#b8860b"/>
      <stop offset="20%"  stop-color="#fff6d0"/>
      <stop offset="50%"  stop-color="#eab308"/>
      <stop offset="80%"  stop-color="#fff6d0"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Pure gold for the sceptre's orb finials, no brown undertone -->
    <radialGradient id="goldOrbGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#fff6d0"/>
      <stop offset="45%"  stop-color="#ffdf70"/>
      <stop offset="75%"  stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>

    <!-- Castle-wall ashlar masonry -->
    <pattern id="stonePattern" width="46" height="24" patternUnits="userSpaceOnUse">
      <rect width="46" height="24" fill="#3a3430"/>
      <rect x="1" y="1" width="20" height="10" rx="1" fill="#433c37" stroke="#221e1b" stroke-width="1"/>
      <rect x="24" y="1" width="21" height="10" rx="1" fill="#433c37" stroke="#221e1b" stroke-width="1"/>
      <rect x="-10" y="13" width="20" height="10" rx="1" fill="#433c37" stroke="#221e1b" stroke-width="1"/>
      <rect x="13" y="13" width="20" height="10" rx="1" fill="#433c37" stroke="#221e1b" stroke-width="1"/>
      <rect x="36" y="13" width="20" height="10" rx="1" fill="#433c37" stroke="#221e1b" stroke-width="1"/>
    </pattern>

    <!-- Vignette so the wall darkens toward the edges -->
    <radialGradient id="vignetteGrad" cx="50%" cy="28%" r="78%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="65%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Stone-wall backdrop everything hangs on -->
  <rect x="2" y="2" width="676" height="288" rx="10" fill="url(#stonePattern)" stroke="url(#bronzeGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="676" height="288" rx="10" fill="url(#vignetteGrad)"/>
  <rect x="6" y="6" width="668" height="280" rx="8" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Wall-mounted gold sceptre-rod the text banner rests on -->
  <path d="M 90 126 L 78 114" stroke="#3d2b06" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 590 126 L 602 114" stroke="#3d2b06" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="88" y1="126" x2="592" y2="126" stroke="#3d2b06" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 90 126 L 78 114" stroke="url(#sceptreGoldGrad)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 590 126 L 602 114" stroke="url(#sceptreGoldGrad)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="88" y1="126" x2="592" y2="126" stroke="url(#sceptreGoldGrad)" stroke-width="4.8" stroke-linecap="round"/>
  <line x1="88" y1="124.3" x2="592" y2="124.3" stroke="#fff3cf" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>

  <!-- Collar bands, like a sceptre's binding rings -->
  <g stroke="#ffd700" stroke-linecap="round">
    <line x1="108" y1="121.5" x2="108" y2="130.5" stroke-width="2.2"/>
    <line x1="113" y1="122" x2="113" y2="130" stroke-width="1.2" opacity="0.7"/>
    <line x1="572" y1="121.5" x2="572" y2="130.5" stroke-width="2.2"/>
    <line x1="567" y1="122" x2="567" y2="130" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Central sceptre jewel -->
  <rect width="9" height="9" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.9"
        transform="translate(340,126) rotate(45) translate(-4.5,-4.5)"/>

  <!-- Ornate orb finials at both ends, projecting outward in line with the rod -->
  <g>
    <!-- left head -->
    <line x1="82" y1="121.5" x2="82" y2="130.5" stroke="url(#sceptreGoldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 76 120 Q 70 116 66 126" fill="none" stroke="url(#sceptreGoldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 76 132 Q 70 136 66 126" fill="none" stroke="url(#sceptreGoldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="70" cy="116" r="1.3" fill="url(#goldOrbGrad)"/>
    <circle cx="70" cy="136" r="1.3" fill="url(#goldOrbGrad)"/>
    <circle cx="76" cy="126" r="5.5" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="1.1"/>
    <circle cx="66" cy="126" r="1.7" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.6"/>

    <!-- right head -->
    <line x1="598" y1="121.5" x2="598" y2="130.5" stroke="url(#sceptreGoldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 604 120 Q 610 116 614 126" fill="none" stroke="url(#sceptreGoldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 604 132 Q 610 136 614 126" fill="none" stroke="url(#sceptreGoldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="610" cy="116" r="1.3" fill="url(#goldOrbGrad)"/>
    <circle cx="610" cy="136" r="1.3" fill="url(#goldOrbGrad)"/>
    <circle cx="604" cy="126" r="5.5" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="1.1"/>
    <circle cx="614" cy="126" r="1.7" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.6"/>
  </g>

  <!-- Small pendant banners hanging straight down from the sceptre, inboard of the orbs -->
  <ellipse cx="135" cy="254" rx="18" ry="4" fill="#000000" opacity="0.2"/>
  <ellipse cx="545" cy="254" rx="18" ry="4" fill="#000000" opacity="0.2"/>
  <g>
    <path d="M 118 126 L 152 126 L 152 248 L 135 236 L 118 248 Z"
          fill="url(#flagGrad)" stroke="url(#bronzeGrad)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 126 130 C 122 170 122 210 119 246" fill="none" stroke="#20081f" stroke-width="1" opacity="0.35"/>
    <circle cx="118" cy="126" r="1.8" fill="url(#goldOrbGrad)"/>
    <circle cx="152" cy="126" r="1.8" fill="url(#goldOrbGrad)"/>
    <circle cx="118" cy="248" r="2" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.6"/>
    <circle cx="152" cy="248" r="2" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.6"/>
    <rect width="7" height="7" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.7"
          transform="translate(135,187) rotate(45) translate(-3.5,-3.5)"/>
  </g>
  <g>
    <path d="M 528 126 L 562 126 L 562 248 L 545 236 L 528 248 Z"
          fill="url(#flagGrad)" stroke="url(#bronzeGrad)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 554 130 C 558 170 558 210 561 246" fill="none" stroke="#20081f" stroke-width="1" opacity="0.35"/>
    <circle cx="528" cy="126" r="1.8" fill="url(#goldOrbGrad)"/>
    <circle cx="562" cy="126" r="1.8" fill="url(#goldOrbGrad)"/>
    <circle cx="528" cy="248" r="2" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.6"/>
    <circle cx="562" cy="248" r="2" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.6"/>
    <rect width="7" height="7" fill="url(#goldOrbGrad)" stroke="#3d2b12" stroke-width="0.7"
          transform="translate(545,187) rotate(45) translate(-3.5,-3.5)"/>
  </g>

  <!-- The banner itself, centred near the top of the wall -->
  <g transform="translate(20,20)">
    <!-- Banner tails, left and right -->
    <path d="M 40 22 L 8 19 L 23 47 L 8 75 L 40 72 Z" fill="url(#bgGrad)" stroke="url(#bronzeGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 600 22 L 632 19 L 617 47 L 632 75 L 600 72 Z" fill="url(#bgGrad)" stroke="url(#bronzeGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="8" cy="47" r="3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.75"/>
    <circle cx="632" cy="47" r="3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.75"/>

    <!-- Central chamfered plaque -->
    <path d="M 54 8 L 586 8 L 600 22 L 600 72 L 586 86 L 54 86 L 40 72 L 40 22 Z"
          fill="url(#bgGrad)" stroke="url(#bronzeGrad)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Twisted-rope trim along the top and bottom edges -->
    <line x1="60" y1="8" x2="580" y2="8" stroke="#3d2411" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="60" y1="8" x2="580" y2="8" stroke="#e8c766" stroke-width="1.5" stroke-dasharray="4 4" stroke-dashoffset="4"/>
    <line x1="60" y1="86" x2="580" y2="86" stroke="#3d2411" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="60" y1="86" x2="580" y2="86" stroke="#e8c766" stroke-width="1.5" stroke-dasharray="4 4" stroke-dashoffset="4"/>

    <!-- Council-coloured inlay, echoing the plaque edge -->
    <path d="M 60 14 L 580 14 L 594 28 L 594 66 L 580 80 L 60 80 L 46 66 L 46 28 Z"
          fill="none" stroke="url(#councilGrad)" stroke-width="1" opacity="0.4"/>

    <!-- Rivets at the four plaque corners -->
    <g stroke="#6b4423" stroke-width="0.75" fill="url(#gemGrad)">
      <circle cx="47" cy="15" r="3"/>
      <circle cx="593" cy="15" r="3"/>
      <circle cx="593" cy="79" r="3"/>
      <circle cx="47" cy="79" r="3"/>
    </g>

    <!-- Hanging wax-seal medallion, top centre -->
    <circle cx="320" cy="10" r="9" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="1.2"/>
    <path d="M 316 6 L 324 14 M 324 6 L 316 14" stroke="#6b4423" stroke-width="1.1" stroke-linecap="round"/>

    <!-- The badge itself, set into the plaque -->
    <rect x="110" y="29" width="420" height="38" fill="url(#badgeGrad)"/>
    <rect x="110" y="29" width="420" height="38" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.85"/>
    <line x1="110" y1="30" x2="530" y2="30" stroke="#f5e0a3" stroke-width="0.6" opacity="0.4"/>

    <text x="320" y="54" text-anchor="middle" fill="#f5e6c8"
          font-family="Cinzel, Georgia, 'Times New Roman', serif"
          font-size="18" font-weight="700" letter-spacing="0.5" style="font-variant: small-caps">⚔ 🗡 The Council of CLAUDE Agents 🗡 ⚔</text>
  </g>

  <!-- Wall-mounted crossbar the crest flags hang from -->
  <!-- dark outline first so the bar reads clearly against the stone -->
  <path d="M 185 140 L 175 130" stroke="#0d0b08" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 495 140 L 505 130" stroke="#0d0b08" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="183" y1="140" x2="497" y2="140" stroke="#0d0b08" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 185 140 L 175 130" stroke="url(#bronzeGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 495 140 L 505 130" stroke="url(#bronzeGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="183" y1="140" x2="497" y2="140" stroke="url(#bronzeGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="183" y1="138.4" x2="497" y2="138.4" stroke="#f5deb3" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <circle cx="183" cy="140" r="4" fill="url(#gemGrad)" stroke="#3d2b12" stroke-width="1"/>
  <circle cx="497" cy="140" r="4" fill="url(#gemGrad)" stroke="#3d2b12" stroke-width="1"/>
  <circle cx="240" cy="140" r="2.5" fill="url(#gemGrad)" stroke="#3d2b12" stroke-width="0.75"/>
  <circle cx="440" cy="140" r="2.5" fill="url(#gemGrad)" stroke="#3d2b12" stroke-width="0.75"/>

  <!-- Grounding shadows for all three flags -->
  <ellipse cx="218" cy="233" rx="28" ry="5" fill="#000000" opacity="0.22"/>
  <ellipse cx="462" cy="233" rx="28" ry="5" fill="#000000" opacity="0.22"/>
  <ellipse cx="340" cy="273" rx="92" ry="7" fill="#000000" opacity="0.3"/>

  <!-- Left wing banner: same wine cloth and bronze trim as the rest, gold house-stripe -->
  <g transform="rotate(-9 240 140)">
    <path d="M 212 140 L 268 140 L 268 231 L 240 210 L 212 231 Z"
          fill="url(#flagGrad)" stroke="url(#bronzeGrad)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 222 144 C 218 172 218 200 214 229" fill="none" stroke="#20081f" stroke-width="1.1" opacity="0.35"/>
    <rect x="235" y="145" width="10" height="62" rx="3" fill="url(#leftFlagGrad)"/>
    <circle cx="212" cy="140" r="2" fill="url(#gemGrad)"/>
    <circle cx="268" cy="140" r="2" fill="url(#gemGrad)"/>
    <circle cx="212" cy="231" r="2.3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.6"/>
    <circle cx="268" cy="231" r="2.3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.6"/>
    <!-- single sword emblem, gold on a dark outline so it reads on the house-stripe -->
    <line x1="240" y1="150" x2="240" y2="200" stroke="#241407" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="233" y1="158" x2="247" y2="158" stroke="#241407" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="240" y1="150" x2="240" y2="200" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="233" y1="158" x2="247" y2="158" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <circle cx="240" cy="203" r="2.2" fill="url(#gemGrad)" stroke="#241407" stroke-width="0.8"/>
  </g>

  <!-- Right wing banner: same wine cloth and bronze trim as the rest, violet house-stripe -->
  <g transform="rotate(9 440 140)">
    <path d="M 412 140 L 468 140 L 468 231 L 440 210 L 412 231 Z"
          fill="url(#flagGrad)" stroke="url(#bronzeGrad)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 458 144 C 462 172 462 200 466 229" fill="none" stroke="#20081f" stroke-width="1.1" opacity="0.35"/>
    <rect x="435" y="145" width="10" height="62" rx="3" fill="url(#rightFlagGrad)"/>
    <circle cx="412" cy="140" r="2" fill="url(#gemGrad)"/>
    <circle cx="468" cy="140" r="2" fill="url(#gemGrad)"/>
    <circle cx="412" cy="231" r="2.3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.6"/>
    <circle cx="468" cy="231" r="2.3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.6"/>
    <!-- single dagger emblem, gold on a dark outline so it reads on the house-stripe -->
    <line x1="440" y1="150" x2="440" y2="194" stroke="#241407" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="435" y1="157" x2="445" y2="157" stroke="#241407" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="440" y1="150" x2="440" y2="194" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="435" y1="157" x2="445" y2="157" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <circle cx="440" cy="197" r="2.2" fill="url(#gemGrad)" stroke="#241407" stroke-width="0.8"/>
  </g>

  <!-- Grand centre crest banner -->
  <path d="M 285 140 L 395 140 L 395 265 L 340 240 L 285 265 Z"
        fill="url(#flagGrad)" stroke="url(#bronzeGrad)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 291 146 L 389 146 L 389 257 L 340 234 L 291 257 Z"
        fill="none" stroke="url(#bronzeGrad)" stroke-width="1" opacity="0.6"/>
  <path d="M 300 146 C 292 185 292 225 284 263" fill="none" stroke="#20081f" stroke-width="1.4" opacity="0.4"/>
  <path d="M 380 146 C 388 185 388 225 396 263" fill="none" stroke="#20081f" stroke-width="1.4" opacity="0.4"/>
  <circle cx="285" cy="140" r="3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.75"/>
  <circle cx="395" cy="140" r="3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.75"/>
  <circle cx="285" cy="265" r="3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.75"/>
  <circle cx="395" cy="265" r="3" fill="url(#gemGrad)" stroke="#6b4423" stroke-width="0.75"/>

  <!-- Coronet -->
  <path d="M 330 150 L 333 142 L 337 148 L 340 140 L 343 148 L 347 142 L 350 150 Z"
        fill="url(#gemGrad)" stroke="#6b4423" stroke-width="1"/>
  <line x1="328" y1="150" x2="352" y2="150" stroke="#6b4423" stroke-width="1.5"/>

  <!-- Council-coloured halo behind the crest -->
  <circle cx="340" cy="191" r="24" fill="none" stroke="url(#councilGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Heater-shield crest, crossed sword and dagger -->
  <path d="M 340 162 L 360 169 L 360 192 Q 360 208 340 220 Q 320 208 320 192 L 320 169 Z"
        fill="url(#bgGrad)" stroke="url(#bronzeGrad)" stroke-width="2"/>
  <path d="M 330 172 L 350 210 M 350 172 L 330 210" stroke="#d4af37" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="340" cy="191" r="2.6" fill="url(#gemGrad)"/>
</svg>
