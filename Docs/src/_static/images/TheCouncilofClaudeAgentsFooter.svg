<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="The gate of the Fortress of The Council of CLAUDE Agents">
  <defs>
    <!-- We are close enough that the wall fills the frame; no sky left -->
    <linearGradient id="ftrWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#150c1e"/>
      <stop offset="55%"  stop-color="#1d1128"/>
      <stop offset="100%" stop-color="#120a1a"/>
    </linearGradient>

    <radialGradient id="ftrGlow" cx="600" cy="240" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffb968" stop-opacity="0.34"/>
      <stop offset="48%"  stop-color="#d0641f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d0641f" stop-opacity="0"/>
    </radialGradient>

    <!-- The lit hall beyond the archway -->
    <linearGradient id="ftrGateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a120f"/>
      <stop offset="35%"  stop-color="#8f4a15"/>
      <stop offset="72%"  stop-color="#eda94f"/>
      <stop offset="100%" stop-color="#ffe9bd"/>
    </linearGradient>

    <radialGradient id="ftrPool" cx="600" cy="254" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffc879" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#e08a34" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e08a34" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ftrTorch" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd48a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd48a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ftrBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b2455"/>
      <stop offset="100%" stop-color="#2b0b2d"/>
    </linearGradient>

    <linearGradient id="ftrVig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#05030b" stop-opacity="0.65"/>
      <stop offset="22%"  stop-color="#05030b" stop-opacity="0"/>
      <stop offset="78%"  stop-color="#05030b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05030b" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- ============ THE WALL FACE, FILLING THE FRAME ============ -->
  <rect width="1200" height="252" fill="url(#ftrWall)"/>

  <!-- stone courses: we are near enough to read the masonry -->
  <g stroke="#0b0612" stroke-opacity="0.55" stroke-width="1.6">
    <path d="M 0 28 L 1200 28"/><path d="M 0 56 L 1200 56"/><path d="M 0 84 L 1200 84"/>
    <path d="M 0 112 L 1200 112"/><path d="M 0 140 L 1200 140"/><path d="M 0 168 L 1200 168"/>
    <path d="M 0 224 L 1200 224"/>
  </g>
  <g stroke="#0b0612" stroke-opacity="0.4" stroke-width="1.3">
    <path d="M 90 0 L 90 28"/><path d="M 230 28 L 230 56"/><path d="M 140 56 L 140 84"/>
    <path d="M 300 84 L 300 112"/><path d="M 200 112 L 200 140"/><path d="M 60 140 L 60 168"/>
    <path d="M 340 140 L 340 168"/><path d="M 120 224 L 120 252"/><path d="M 320 224 L 320 252"/>
    <path d="M 1110 0 L 1110 28"/><path d="M 970 28 L 970 56"/><path d="M 1060 56 L 1060 84"/>
    <path d="M 900 84 L 900 112"/><path d="M 1000 112 L 1000 140"/><path d="M 1140 140 L 1140 168"/>
    <path d="M 860 140 L 860 168"/><path d="M 1080 224 L 1080 252"/><path d="M 880 224 L 880 252"/>
  </g>

  <rect width="1200" height="280" fill="url(#ftrGlow)"/>

  <!-- ============ STRING COURSE AT THE ARCH'S SPRINGING ============ -->
  <rect x="0" y="196" width="1200" height="14" fill="#241733"/>
  <g fill="#150c1e">
    <path d="M 24 210 L 40 210 L 36 220 L 28 220 Z"/><path d="M 76 210 L 92 210 L 88 220 L 80 220 Z"/>
    <path d="M 128 210 L 144 210 L 140 220 L 132 220 Z"/><path d="M 180 210 L 196 210 L 192 220 L 184 220 Z"/>
    <path d="M 232 210 L 248 210 L 244 220 L 236 220 Z"/><path d="M 284 210 L 300 210 L 296 220 L 288 220 Z"/>
    <path d="M 336 210 L 352 210 L 348 220 L 340 220 Z"/><path d="M 388 210 L 404 210 L 400 220 L 392 220 Z"/>
    <path d="M 796 210 L 812 210 L 808 220 L 800 220 Z"/><path d="M 848 210 L 864 210 L 860 220 L 852 220 Z"/>
    <path d="M 900 210 L 916 210 L 912 220 L 904 220 Z"/><path d="M 952 210 L 968 210 L 964 220 L 956 220 Z"/>
    <path d="M 1004 210 L 1020 210 L 1016 220 L 1008 220 Z"/><path d="M 1056 210 L 1072 210 L 1068 220 L 1060 220 Z"/>
    <path d="M 1108 210 L 1124 210 L 1120 220 L 1112 220 Z"/><path d="M 1160 210 L 1176 210 L 1172 220 L 1164 220 Z"/>
  </g>

  <!-- ============ THE ARCHWAY, FILLING MOST OF THE FRAME ============ -->
  <path d="M 450 252 L 450 210 A 150 150 0 0 1 750 210 L 750 252 Z" fill="#2b1a3c"/>
  <path d="M 462 252 L 462 210 A 138 138 0 0 1 738 210 L 738 252 Z" fill="#1a1024"/>
  <path d="M 470 252 L 470 210 A 130 130 0 0 1 730 210 L 730 252 Z" fill="url(#ftrGateway)"/>

  <!-- voussoirs: the wedge stones ringing the arch -->
  <g stroke="#0b0612" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M 452 186 L 464 188"/><path d="M 462 140 L 474 145"/><path d="M 484 100 L 494 108"/>
    <path d="M 517 71 L 524 81"/><path d="M 558 55 L 562 67"/><path d="M 600 50 L 600 62"/>
    <path d="M 642 55 L 638 67"/><path d="M 683 71 L 676 81"/><path d="M 716 100 L 706 108"/>
    <path d="M 738 140 L 726 145"/><path d="M 748 186 L 736 188"/>
  </g>

  <!-- ============ THE PORTCULLIS, RAISED ============ -->
  <rect x="524" y="102" width="152" height="9" fill="#0d0714"/>
  <g fill="#0d0714">
    <path d="M 534 111 L 541 111 L 541 132 L 537.5 140 L 534 132 Z"/>
    <path d="M 564 111 L 571 111 L 571 132 L 567.5 140 L 564 132 Z"/>
    <path d="M 594 111 L 601 111 L 601 132 L 597.5 140 L 594 132 Z"/>
    <path d="M 624 111 L 631 111 L 631 132 L 627.5 140 L 624 132 Z"/>
    <path d="M 654 111 L 661 111 L 661 132 L 657.5 140 L 654 132 Z"/>
  </g>

  <!-- ============ THE CREST, SET IN THE WALL ABOVE THE KEYSTONE ============ -->
  <path d="M 600 6 L 621 14 L 621 36 Q 621 48 600 56 Q 579 48 579 36 L 579 14 Z"
        fill="#241733" stroke="#e0b055" stroke-opacity="0.9" stroke-width="1.5"/>
  <path d="M 588 20 L 612 46 M 612 20 L 588 46"
        stroke="#f0c46a" stroke-width="2.3" stroke-linecap="round"/>

  <!-- ============ BANNERS EITHER SIDE OF THE GATE ============ -->
  <g fill="#0a0512">
    <rect x="286" y="66" width="60" height="6" rx="2"/>
    <rect x="854" y="66" width="60" height="6" rx="2"/>
  </g>
  <g fill="url(#ftrBanner)" stroke="#c9962f" stroke-width="1.3" stroke-linejoin="round">
    <path d="M 292 72 L 340 72 L 340 186 L 316 172 L 292 186 Z"/>
    <path d="M 860 72 L 908 72 L 908 186 L 884 172 L 860 186 Z"/>
  </g>
  <g stroke="#e8b45f" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M 304 104 L 328 140 M 328 104 L 304 140"/>
    <path d="M 872 104 L 896 140 M 896 104 L 872 140"/>
  </g>

  <!-- ============ WALL LAMPS ============ -->
  <g fill="#ffcf8a">
    <rect x="146" y="120" width="9" height="18" rx="4.5"/><rect x="1045" y="120" width="9" height="18" rx="4.5"/>
    <rect x="146" y="44"  width="9" height="18" rx="4.5" fill="#fff0c8"/><rect x="1045" y="44" width="9" height="18" rx="4.5" fill="#fff0c8"/>
  </g>

  <!-- ============ BRAZIERS FLANKING THE ROAD ============ -->
  <g>
    <circle cx="404" cy="196" r="46" fill="url(#ftrTorch)"/>
    <circle cx="796" cy="196" r="46" fill="url(#ftrTorch)"/>
    <rect x="400" y="198" width="9" height="54" fill="#0d0714"/>
    <rect x="792" y="198" width="9" height="54" fill="#0d0714"/>
    <path d="M 392 198 L 417 198 L 411 186 L 398 186 Z" fill="#0d0714"/>
    <path d="M 784 198 L 809 198 L 803 186 L 790 186 Z" fill="#0d0714"/>
    <path d="M 404 164 Q 413 179 404 188 Q 395 179 404 164 Z" fill="#ffd48a"/>
    <path d="M 796 164 Q 805 179 796 188 Q 787 179 796 164 Z" fill="#ffd48a"/>
    <path d="M 404 172 Q 409 181 404 187 Q 399 181 404 172 Z" fill="#fff3d0"/>
    <path d="M 796 172 Q 801 181 796 187 Q 791 181 796 172 Z" fill="#fff3d0"/>
  </g>

  <!-- ============ THE CAUSEWAY ============ -->
  <rect x="0" y="252" width="1200" height="28" fill="#0c0713"/>
  <rect x="0" y="232" width="1200" height="48" fill="url(#ftrPool)"/>
  <g stroke="#3a2440" stroke-opacity="0.45" stroke-width="1.2">
    <path d="M 0 264 L 1200 264"/>
    <path d="M 150 252 L 128 280"/><path d="M 340 252 L 328 280"/><path d="M 480 252 L 476 280"/>
    <path d="M 600 252 L 600 280"/><path d="M 720 252 L 724 280"/><path d="M 860 252 L 872 280"/>
    <path d="M 1050 252 L 1072 280"/>
  </g>

  <rect width="1200" height="280" fill="url(#ftrVig)"/>
</svg>
