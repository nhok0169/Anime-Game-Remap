<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="The entrance to the Fortress of The Council of CLAUDE Agents">
  <!-- The entrance. Close enough that the wall fills the frame and no sky is
       left, but the verticals still run to the header's vanishing point
       (600, -800) so the two images read as one place. Base is y=252. -->
  <defs>
    <linearGradient id="ftrWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#150c1e"/>
      <stop offset="55%"  stop-color="#20132c"/>
      <stop offset="100%" stop-color="#140b1c"/>
    </linearGradient>
    <linearGradient id="ftrPier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#120a1a"/>
      <stop offset="45%"  stop-color="#241634"/>
      <stop offset="100%" stop-color="#100818"/>
    </linearGradient>

    <radialGradient id="ftrGlow" cx="600" cy="235" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffb968" stop-opacity="0.40"/>
      <stop offset="46%"  stop-color="#d0641f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d0641f" stop-opacity="0"/>
    </radialGradient>

    <!-- The lit hall beyond: this is the way in -->
    <linearGradient id="ftrGateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a120f"/>
      <stop offset="34%"  stop-color="#8f4a15"/>
      <stop offset="70%"  stop-color="#eda94f"/>
      <stop offset="100%" stop-color="#ffe9bd"/>
    </linearGradient>

    <radialGradient id="ftrPool" cx="600" cy="254" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffc879" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#e08a34" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#e08a34" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ftrTorch" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd48a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd48a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ftrBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b2455"/>
      <stop offset="100%" stop-color="#2b0b2d"/>
    </linearGradient>

    <linearGradient id="ftrVig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#05030b" stop-opacity="0.62"/>
      <stop offset="24%"  stop-color="#05030b" stop-opacity="0"/>
      <stop offset="76%"  stop-color="#05030b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05030b" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <!-- ============ THE WALL, FILLING THE FRAME ============ -->
  <rect width="1200" height="252" fill="url(#ftrWall)"/>

  <!-- masonry: courses stay level, joints lean to the vanishing point -->
  <g stroke="#0b0612" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M 0 28 L 1200 28"/><path d="M 0 56 L 1200 56"/><path d="M 0 84 L 1200 84"/>
    <path d="M 0 112 L 1200 112"/><path d="M 0 140 L 1200 140"/><path d="M 0 168 L 1200 168"/>
    <path d="M 0 196 L 1200 196"/><path d="M 0 224 L 1200 224"/>
  </g>
  <g stroke="#0b0612" stroke-opacity="0.38" stroke-width="1.2">
    <path d="M 182.9 28 L 168.7 56"/><path d="M 266.4 56 L 255.5 84"/>
    <path d="M 188.3 84 L 175.2 112"/><path d="M 305.2 112 L 296.2 140"/>
    <path d="M 197.9 140 L 185.9 168"/><path d="M 84.7 168 L 69.8 196"/>
    <path d="M 316 196 L 308 224"/><path d="M 210.6 224 L 200 252"/>
    <path d="M 1017.1 28 L 1031.3 56"/><path d="M 933.6 56 L 944.5 84"/>
    <path d="M 1011.7 84 L 1024.8 112"/><path d="M 894.8 112 L 903.8 140"/>
    <path d="M 1002.1 140 L 1014.1 168"/><path d="M 1115.3 168 L 1130.2 196"/>
    <path d="M 884 196 L 892 224"/><path d="M 989.4 224 L 1000 252"/>
  </g>

  <rect width="1200" height="280" fill="url(#ftrGlow)"/>

  <!-- ============ THE PIERS FLANKING THE GATE ============ -->
  <g fill="url(#ftrPier)" stroke="#0b0612" stroke-opacity="0.5" stroke-width="1.2">
    <path d="M 360 252 L 417.5 0 L 478.3 0 L 440 252 Z"/>
    <path d="M 760 252 L 721.7 0 L 782.5 0 L 840 252 Z"/>
  </g>

  <!-- ============ STRING COURSE, DYING INTO THE ARCH ============ -->
  <g fill="#241733">
    <rect x="0" y="204" width="452" height="13"/><rect x="748" y="204" width="452" height="13"/>
  </g>
  <g fill="#150c1e">
    <path d="M 36 217 L 52 217 L 48 226 L 40 226 Z"/><path d="M 100 217 L 116 217 L 112 226 L 104 226 Z"/>
    <path d="M 164 217 L 180 217 L 176 226 L 168 226 Z"/><path d="M 228 217 L 244 217 L 240 226 L 232 226 Z"/>
    <path d="M 292 217 L 308 217 L 304 226 L 296 226 Z"/><path d="M 356 217 L 372 217 L 368 226 L 360 226 Z"/>
    <path d="M 828 217 L 844 217 L 840 226 L 832 226 Z"/><path d="M 892 217 L 908 217 L 904 226 L 896 226 Z"/>
    <path d="M 956 217 L 972 217 L 968 226 L 960 226 Z"/><path d="M 1020 217 L 1036 217 L 1032 226 L 1024 226 Z"/>
    <path d="M 1084 217 L 1100 217 L 1096 226 L 1088 226 Z"/><path d="M 1148 217 L 1164 217 L 1160 226 L 1152 226 Z"/>
  </g>

  <!-- ============ THE ARCHWAY =========================================
       Centred on the vanishing axis, so perspective narrows it rather than
       leaning it: elliptical arcs with rx pulled in from ry.
       ============================================================== -->
  <path d="M 450 252 L 456 210 A 144 150 0 0 1 744 210 L 750 252 Z" fill="#2b1a3c"/>
  <path d="M 460 252 L 465.6 210 A 134.4 140 0 0 1 734.4 210 L 740 252 Z" fill="#1a1024"/>
  <path d="M 470 252 L 475.2 210 A 124.8 130 0 0 1 724.8 210 L 730 252 Z" fill="url(#ftrGateway)"/>

  <!-- voussoirs, the wedge stones ringing the arch -->
  <g stroke="#0b0612" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M 467 152.6 L 484.2 160.1"/><path d="M 498.2 103.9 L 511.4 117.7"/>
    <path d="M 544.9 71.4 L 552 89.4"/><path d="M 600 60 L 600 79.5"/>
    <path d="M 655.1 71.4 L 648 89.4"/><path d="M 701.8 103.9 L 688.6 117.7"/>
    <path d="M 733 152.6 L 715.8 160.1"/>
  </g>

  <!-- ============ THE PORTCULLIS, RAISED ============ -->
  <rect x="528" y="104" width="144" height="9" fill="#0d0714"/>
  <g fill="#0d0714">
    <path d="M 540 113 L 548 113 L 546.5 140 L 542.3 148 L 538.2 140 Z"/>
    <path d="M 570 113 L 578 113 L 577.3 140 L 573.2 148 L 569.1 140 Z"/>
    <path d="M 600 113 L 608 113 L 608.2 140 L 604.1 148 L 600 140 Z"/>
    <path d="M 630 113 L 638 113 L 639.1 140 L 635 148 L 630.9 140 Z"/>
    <path d="M 660 113 L 668 113 L 670 140 L 665.9 148 L 661.8 140 Z"/>
  </g>

  <!-- ============ THE CREST, SET IN THE WALL ABOVE THE KEYSTONE ============ -->
  <path d="M 600 8 L 620 15 L 620 36 Q 620 47 600 54 Q 580 47 580 36 L 580 15 Z"
        fill="#241733" stroke="#e0b055" stroke-opacity="0.9" stroke-width="1.5"/>
  <path d="M 589 21 L 611 45 M 611 21 L 589 45"
        stroke="#f0c46a" stroke-width="2.3" stroke-linecap="round"/>

  <!-- ============ BANNERS ON THE PIERS ============ -->
  <g fill="#0a0512">
    <path d="M 413.9 70 L 415.4 63 L 459.7 63 L 458.6 70 Z"/>
    <path d="M 741.4 70 L 740.3 63 L 784.6 63 L 786.1 70 Z"/>
  </g>
  <g fill="url(#ftrBanner)" stroke="#c9962f" stroke-width="1.3" stroke-linejoin="round">
    <path d="M 419.7 70 L 452.8 70 L 434.5 178 L 418.4 165 L 397.3 178 Z"/>
    <path d="M 747.2 70 L 780.3 70 L 802.7 178 L 781.6 165 L 765.5 178 Z"/>
  </g>
  <g stroke="#e8b45f" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M 418.6 100 L 436.2 134 M 442.6 100 L 412.2 134"/>
    <path d="M 781.4 100 L 763.8 134 M 757.4 100 L 787.8 134"/>
  </g>

  <!-- ============ WALL LAMPS ============ -->
  <g fill="#ffcf8a">
    <path d="M 147.7 100.5 Q 154.5 91.5 156.8 100.5 L 152.4 109.5 Q 145.6 118.5 143.2 109.5 Z"/>
    <path d="M 1052.3 100.5 Q 1045.5 91.5 1043.2 100.5 L 1047.6 109.5 Q 1054.4 118.5 1056.8 109.5 Z"/>
    <path d="M 248.3 154.5 Q 254.5 145.5 257.4 154.5 L 254.2 163.5 Q 248 172.5 245 163.5 Z" fill="#fff0c8"/>
    <path d="M 951.7 154.5 Q 945.5 145.5 942.6 154.5 L 945.8 163.5 Q 952 172.5 955 163.5 Z"/>
    <path d="M 148 208.5 Q 154.5 199.5 157 208.5 L 153.1 217.5 Q 146.5 226.5 143.9 217.5 Z"/>
    <path d="M 1052 208.5 Q 1045.5 199.5 1043 208.5 L 1046.9 217.5 Q 1053.5 226.5 1056.1 217.5 Z" fill="#fff0c8"/>
    <path d="M 57.4 128.5 Q 64.5 119.5 66.4 128.5 L 61.2 137.5 Q 54.1 146.5 52.1 137.5 Z"/>
    <path d="M 1142.6 128.5 Q 1135.5 119.5 1133.6 128.5 L 1138.8 137.5 Q 1145.9 146.5 1147.9 137.5 Z"/>
  </g>

  <!-- ============ BRAZIERS AT THE PIER FEET ============ -->
  <g>
    <circle cx="414.5" cy="190" r="46" fill="url(#ftrTorch)"/>
    <circle cx="786.4" cy="190" r="46" fill="url(#ftrTorch)"/>
    <path d="M 396 252 L 406.1 200 L 414.6 200 L 405 252 Z" fill="#0d0714"/>
    <path d="M 796 252 L 786.3 200 L 794.9 200 L 805 252 Z" fill="#0d0714"/>
    <path d="M 398.5 200 L 400.7 189 L 424.2 189 L 422.2 200 Z" fill="#0d0714"/>
    <path d="M 778.7 200 L 776.7 189 L 800.2 189 L 802.5 200 Z" fill="#0d0714"/>
    <path d="M 414.5 160 Q 424 176 414.5 187 Q 405 176 414.5 160 Z" fill="#ffd48a"/>
    <path d="M 786.4 160 Q 795.9 176 786.4 187 Q 776.9 176 786.4 160 Z" fill="#ffd48a"/>
    <path d="M 414.5 169 Q 420 179 414.5 186 Q 409 179 414.5 169 Z" fill="#fff3d0"/>
    <path d="M 786.4 169 Q 791.9 179 786.4 186 Q 780.9 179 786.4 169 Z" fill="#fff3d0"/>
  </g>

  <!-- ============ THE CAUSEWAY, LIT FROM THE DOORWAY ============ -->
  <rect x="0" y="252" width="1200" height="28" fill="#0c0713"/>
  <rect x="0" y="230" width="1200" height="50" fill="url(#ftrPool)"/>
  <g stroke="#3a2440" stroke-opacity="0.45" stroke-width="1.2">
    <path d="M 0 264 L 1200 264"/>
    <path d="M 200 252 L 178 280"/><path d="M 380 252 L 368 280"/><path d="M 500 252 L 495 280"/>
    <path d="M 600 252 L 600 280"/><path d="M 700 252 L 705 280"/><path d="M 820 252 L 832 280"/>
    <path d="M 1000 252 L 1022 280"/>
  </g>

  <rect width="1200" height="280" fill="url(#ftrVig)"/>
</svg>
